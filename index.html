  <!-- 1. Estructura Visual (HTML) -->
<div id="modal-bienvenida">
    <div class="tarjeta-bienvenida">
        <h2>✨ ¡Bienvenido a Hispaniola! ✨</h2>
        <p>Por favor, dinos tu nombre para darte la bienvenida:</p>
        <input type="text" id="input-nombre" placeholder="Tu nombre aquí..." autocomplete="off">
        <button id="btn-ingresar">Ingresar</button>
    </div>
</div>

<div id="cartel-saludo"></div>

<!-- 2. Diseño y Animaciones (CSS) -->
<style>
    /* Fondo que cubre la pantalla */
    #modal-bienvenida {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(139, 69, 19, 0.96); /* Terracota oscuro */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* Tarjeta blanca central */
    .tarjeta-bienvenida {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        max-width: 400px;
        width: 90%;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .tarjeta-bienvenida h2 {
        color: #8B4513;
        margin-top: 0;
        font-size: 24px;
    }

    .tarjeta-bienvenida p {
        color: #555555;
        margin-bottom: 20px;
    }

    /* Cuadro de texto */
    #input-nombre {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 2px solid #8B4513;
        border-radius: 8px;
        font-size: 16px;
        box-sizing: border-box;
        outline: none;
        color: #333333;
    }

    /* Botón de ingreso */
    #btn-ingresar {
        background-color: #8B4513;
        color: white;
        border: none;
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        transition: background 0.3s;
    }

    #btn-ingresar:hover {
        background-color: #A0522D;
    }

    /* Cartel flotante de la esquina inferior izquierda */
    #cartel-saludo {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background-color: #8B4513;
        color: #ffffff;
        padding: 14px 28px;
        border-radius: 25px;
        z-index: 10000;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bold;
        box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        transform: translateY(100px);
        opacity: 0;
        transition: opacity 0.6s ease, transform 0.6s ease;
        pointer-events: none;
    }

    /* Clase para activar el cartel animado */
    #cartel-saludo.activo {
        opacity: 1;
        transform: translateY(0);
    }
</style>

<!-- 3. Lógica Independiente (JavaScript) -->
<script>
    (function() {
        // Ejecución inmediata y aislada para evitar conflictos de variables
        const modal = document.getElementById('modal-bienvenida');
        const btn = document.getElementById('btn-ingresar');
        const input = document.getElementById('input-nombre');
        const saludo = document.getElementById('cartel-saludo');

        if (!modal || !btn || !input || !saludo) return;

        function procesarIngreso() {
            let nombre = input.value.trim();
            if (!nombre) {
                nombre = "visitante";
            }

            // 1. Desvanecer y apagar el bloqueo del modal por completo
            modal.style.opacity = '0';
            modal.style.pointerEvents = 'none';

            // 2. Personalizar el texto e iniciar la animación del cartel abajo a la izquierda
            saludo.innerText = `✨ ¡Sea bienvenido a Hispaniola, ${nombre}! ✨`;
            
            // Retraso de 400ms para que aparezca después de que el modal empiece a borrarse
            setTimeout(() => {
                saludo.classList.add('activo');
            }, 400);

            // 3. Desvanecer el cartelito de la esquina tras 5 segundos
            setTimeout(() => {
                saludo.classList.remove('activo');
            }, 5400);
        }

        // Eventos nativos e instantáneos
        btn.onclick = function() {
            procesarIngreso();
        };

        input.onkeypress = function(e) {
            if (e.key === 'Enter') {
                procesarIngreso();
            }
        };
    })();
</script>
